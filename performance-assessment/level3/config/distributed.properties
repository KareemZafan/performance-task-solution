# Distributed (master/slave) settings. The SAME file is used on the master and on every slave (-q).
#
# Master (client)                      Slave (server / jmeter-server)
#   client.rmi.localport=60000  <----    callbacks: slave pushes sample results back to master
#   ----> server_port=1099                RMI registry lookup on the slave
#   ----> server.rmi.localport=4000       RMI object port where the slave engine listens

# Lab only: no RMI over SSL (otherwise every node needs the same rmi_keystore.jks, made with bin/create-rmi-keystore.sh)
server.rmi.ssl.disable=true

# Slave side: fixed ports so firewalls/security groups can be opened precisely
server_port=1099
server.rmi.localport=4000

# Master side: fixed port the slaves call back to (otherwise it is random => firewall pain)
client.rmi.localport=60000

# Default slave list for "-r" (run on all). "-R ip1,ip2" on the command line overrides this.
remote_hosts=192.168.56.11,192.168.56.12

# How slaves send results to master. StrippedBatch = batched + response bodies removed (less network & master heap).
mode=StrippedBatch
